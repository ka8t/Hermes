name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "skills/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push ghcr.io/ka8t/hermes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nousresearch/hermes-agent ships both linux/amd64 and linux/arm64
      # (confirmed via docker manifest inspect) — the macOS guide's
      # docker-compose.yml pins platform: linux/arm64, so this image must
      # be multi-arch too or `docker compose up` on a Mac fails with
      # "found but does not provide the specified platform (linux/arm64)".
      # QEMU + buildx is what makes cross-building the arm64 variant
      # possible on the amd64 GitHub-hosted runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ka8t/hermes:latest
            ghcr.io/ka8t/hermes:${{ github.sha }}

services:
  hermes:
    image: ghcr.io/ka8t/hermes:latest
    platform: linux/arm64
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    env_file:
      - .env
    volumes:
      - ./data:/opt/data
    ports:
      - "8642:8642"   # gateway
      - "9119:9119"   # web dashboard (if HERMES_DASHBOARD=1)
    extra_hosts:
      # Docker Desktop for Mac already resolves this on its own; this line
      # keeps the file portable if you ever run it on native Linux Docker.
      - "host.docker.internal:host-gateway"

# NB: llama-swap / llama-server are intentionally NOT here — they run
# natively on the Mac (scripts/run-llama-swap.sh) to keep Metal GPU
# acceleration, which Docker Desktop for Mac cannot expose to a container.
# See README.md.

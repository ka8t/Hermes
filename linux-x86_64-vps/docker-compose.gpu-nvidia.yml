# GPU override for docker-compose.yml (issue #13). Use ALONGSIDE the base
# file, not instead of it:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu-nvidia.yml up -d
#
# Prerequisites this repo cannot install or verify for you:
#   - An NVIDIA GPU and its driver already working on the host
#     (`nvidia-smi` should already print a GPU before you touch Docker).
#   - The NVIDIA Container Toolkit installed and configured for Docker —
#     see ../shared/gpu-setup.md for the official install-guide link and
#     the exact verification command.
#
# No separate models.yaml step needed — like the CPU base file (2026-09-15,
# issue #101), this overlay runs llama-server directly via `command:`
# below, no llama-swap in between. It still uses the
# ghcr.io/mostlygeek/llama-swap:cuda image as the *source* of a working
# CUDA-enabled llama-server binary at /app/llama-server (building CUDA
# support ourselves is out of scope) — llama-swap itself, also present in
# that image, is never invoked. Set LLAMA_GPU_LAYERS in .env (99 = offload
# every layer).
#
# NOT LIVE-VERIFIED: written without a GPU-equipped machine available to
# test against (see ../shared/gpu-setup.md's status note). Confirm it
# actually works before trusting it:
#   docker compose exec llama-server nvidia-smi   # should list llama-server
#   ./scripts/verify-inference.sh                 # tok/s should jump sharply
#                                                  # versus the CPU numbers in
#                                                  # ../shared/hardware-sizing.md
services:
  llama-server:
    build: !reset null
    image: ghcr.io/mostlygeek/llama-swap:cuda
    # !override, not the default append merge: the base file's
    # ./vendor/llama.cpp-prebuilt mount is CPU-only-binary-specific and
    # doesn't apply here (this image already bundles its own GPU binary).
    volumes: !override
      - ./models:/models:ro
    command:
      - /app/llama-server
      - --port
      - "8080"
      - --host
      - "0.0.0.0"
      - --model
      - /models/${MODEL_FILE}
      - --ctx-size
      - ${LLAMA_CTX_SIZE}
      - --threads
      - ${LLAMA_THREADS}
      - --n-gpu-layers
      - ${LLAMA_GPU_LAYERS}
      - --jinja
      - --flash-attn
      - "on"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - --predict
      - "4096"
      - --repeat-penalty
      - "1.1"
      - --skip-chat-parsing
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

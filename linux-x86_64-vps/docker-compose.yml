services:
  llama-server:
    # Runs the official prebuilt llama-server binary directly (see
    # ./scripts/download-prebuilt-llama-server.sh, bind-mounted below) —
    # no llama-swap in front of it. This deployment always runs exactly
    # one model, never swaps at runtime, so llama-swap's routing/
    # multi-model layer bought nothing here and its separate,
    # untracked update lifecycle caused a real incident (issue #101,
    # 2026-09-15: the VPS silently ran a two-week-stale llama-server).
    # See docs/ARCHITECTURE.md.
    build:
      context: .
      dockerfile: docker/llama-server.Dockerfile
    container_name: llama-server
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
      - ./vendor/llama.cpp-prebuilt/current:/vendor:ro
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    # Flags match what config/models.yaml.example used to pass through
    # llama-swap — see shared/model-notes.md for why each one is here
    # (KV-cache quantization issue #52, --predict cap issue #82,
    # --repeat-penalty issue #101).
    command:
      - /vendor/llama-server
      - --port
      - "8080"
      - --host
      - "0.0.0.0"
      - --model
      - /models/${MODEL_FILE}
      - --ctx-size
      - ${LLAMA_CTX_SIZE}
      - --threads
      - ${LLAMA_THREADS}
      - --jinja
      - --flash-attn
      - "on"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - --predict
      - "4096"
      - --repeat-penalty
      - "1.1"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  hermes:
    image: ghcr.io/ka8t/hermes:latest
    container_name: hermes
    restart: unless-stopped
    depends_on:
      llama-server:
        condition: service_healthy
    command: gateway run
    env_file:
      - .env
    volumes:
      - ./data:/opt/data
      # NOT a direct bind-mount of ./.env onto /opt/data/.env, unlike the
      # macOS Docker path — tried that first and reverted it live,
      # 2026-09-07: this image's own boot-time ownership step chowns
      # /opt/data/.env to its internal UID on EVERY container start (not
      # just first creation), and on native Linux Docker (this VPS, no
      # Docker Desktop virtiofs translation) that lands on the real host
      # inode, locking the host user out of its own env_file.
      #
      # Instead: bind-mount the project .env to a SIBLING path
      # (.env.real), and make /opt/data/.env a symlink to it. The same
      # boot-time ownership step explicitly skips chown/chmod on a
      # symlinked path (refuse_symlinked_path() in stage2-hook.sh,
      # confirmed by reading the installed image source), and
      # hermes-agent's own save_env_value() (used by `hermes gateway
      # setup`) writes via an atomic_replace() that explicitly resolves
      # and preserves symlinks rather than replacing them — both verified
      # live, 2026-09-07. See ../shared/single-env-file.md.
      - ./.env:/opt/data/.env.real
    ports:
      - "8642:8642"   # gateway
      - "127.0.0.1:8090:8090"   # WhatsApp Cloud API webhook (WHATSAPP_CLOUD_WEBHOOK_PORT)
      - "127.0.0.1:3978:3978"   # Microsoft Teams webhook (TEAMS_PORT)
                                # Both loopback-only; cloudflared reaches them
                                # over the internal Docker network, not these
                                # mappings (kept for local curl tests only).
                                # See ../shared/cloudflare-tunnel-setup.md.
      - "9119:9119"   # web dashboard (if HERMES_DASHBOARD=1)

  # Exposes hermes's per-platform webhook listeners (127.0.0.1-only
  # otherwise) over public HTTPS hostnames, for channels that need
  # Meta/Microsoft to reach them — WhatsApp Business Cloud API (port 8090)
  # and Microsoft Teams (port 3978), each its own listener, not a shared
  # one. Telegram needs none of this (it polls outbound).
  #
  # Gated behind the "cloudflare" Compose profile — NOT started by a plain
  # `docker compose up -d`. Found live, 2026-09-06: this service used to
  # start unconditionally with `restart: unless-stopped`, and without a
  # real CLOUDFLARE_TUNNEL_TOKEN, `cloudflared tunnel run --token ""` fails
  # immediately and gets restarted forever — a real, silent crash-loop on
  # any Telegram-only deployment (the common case), not the harmless no-op
  # the old comment here claimed. Activate by setting BOTH
  # CLOUDFLARE_TUNNEL_TOKEN and `COMPOSE_PROFILES=cloudflare` in .env — see
  # ../shared/cloudflare-tunnel-setup.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      - hermes

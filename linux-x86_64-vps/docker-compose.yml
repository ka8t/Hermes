services:
  llama-swap:
    # Legacy image (llama.cpp's own container + llama-swap copied in): bundles
    # /app/llama-server and /app/llama-swap, CPU-only — no GPU on this VPS.
    # See ../shared/prebuilt-binaries.md for what's confirmed inside it.
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: llama-swap
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
      - ./data/models.yaml:/app/config.yaml:ro
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # curl, not wget: this image (ghcr.io/mostlygeek/llama-swap:cpu, based
      # on Ubuntu 24.04) has curl but not wget — confirmed by inspecting it;
      # wget silently fails every check forever, so hermes's
      # depends_on/service_healthy below would never unblock.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  hermes:
    image: ghcr.io/ka8t/hermes:latest
    container_name: hermes
    restart: unless-stopped
    depends_on:
      llama-swap:
        condition: service_healthy
    command: gateway run
    env_file:
      - .env
    volumes:
      - ./data:/opt/data
    ports:
      - "8642:8642"   # gateway
      - "127.0.0.1:8090:8090"   # WhatsApp Cloud API webhook (WHATSAPP_CLOUD_WEBHOOK_PORT)
      - "127.0.0.1:3978:3978"   # Microsoft Teams webhook (TEAMS_PORT)
                                # Both loopback-only; cloudflared reaches them
                                # over the internal Docker network, not these
                                # mappings (kept for local curl tests only).
                                # See ../shared/cloudflare-tunnel-setup.md.
      - "9119:9119"   # web dashboard (if HERMES_DASHBOARD=1)

  # Exposes hermes's per-platform webhook listeners (127.0.0.1-only
  # otherwise) over public HTTPS hostnames, for channels that need
  # Meta/Microsoft to reach them — WhatsApp Business Cloud API (port 8090)
  # and Microsoft Teams (port 3978), each its own listener, not a shared
  # one. Telegram needs none of this (it polls outbound). Only starts doing
  # anything once CLOUDFLARE_TUNNEL_TOKEN is set in .env — see
  # ../shared/cloudflare-tunnel-setup.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      - hermes
